<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Prefill, decode, and the KV cache</title>
  <desc id="desc">A prompt is processed during prefill to create key and value cache tensors. During each decode step the model reads that cache, produces one new token, and appends new keys and values.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10152c"/><stop offset="1" stop-color="#1d2854"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#aebbe8"/></marker><style>.h{font:700 23px system-ui,sans-serif;fill:#fff}.s{font:500 14px system-ui,sans-serif;fill:#cbd5f5}.k{font:700 12px system-ui,sans-serif;letter-spacing:1.2px;fill:#f6b865}.b{font:700 16px system-ui,sans-serif;fill:#fff}.t{font:500 12px system-ui,sans-serif;fill:#cbd5f5}.m{font:600 13px ui-monospace,monospace;fill:#dce5ff}</style></defs>
  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>
  <text x="52" y="58" class="k">INFERENCE LIFECYCLE</text><text x="52" y="94" class="h">Why a long conversation becomes a memory problem</text><text x="52" y="121" class="s">Prefill processes the prompt once. Decode produces tokens one step at a time.</text>
  <path d="M266 258H352M576 258H665M905 258H1010" stroke="#aebbe8" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
  <path d="M1080 342V390H736V342" stroke="#fb8cc7" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)" fill="none"/>
  <g transform="translate(52 189)"><rect width="214" height="138" rx="16" fill="#20325f" stroke="#8ea6ff" stroke-width="2"/><text x="20" y="31" class="k">PROMPT</text><text x="20" y="62" class="b">All input tokens</text><text x="20" y="92" class="m">[t₀, t₁, …, tₙ]</text><text x="20" y="117" class="t">Longer input → more prefill work</text></g>
  <g transform="translate(352 174)"><rect width="224" height="168" rx="16" fill="#28533c" stroke="#70dd9e" stroke-width="2"/><text x="20" y="31" class="k">PREFILL</text><text x="20" y="62" class="b">Run Transformer once</text><text x="20" y="93" class="t">Compute hidden states, keys, and values</text><text x="20" y="121" class="t">for every prompt position.</text><text x="20" y="146" class="m">heavy compute stage</text></g>
  <g transform="translate(665 164)"><rect width="240" height="188" rx="16" fill="#562d4d" stroke="#fb8cc7" stroke-width="2"/><text x="20" y="31" class="k">KV CACHE</text><text x="20" y="62" class="b">Saved K and V tensors</text><text x="20" y="93" class="m">[layers, batch, T, kv_heads, head_dim]</text><text x="20" y="125" class="t">Avoids recomputing earlier context.</text><text x="20" y="151" class="t">Grows with sequence length × concurrency.</text></g>
  <g transform="translate(1010 189)"><rect width="138" height="138" rx="16" fill="#684927" stroke="#f6b865" stroke-width="2"/><text x="18" y="31" class="k">DECODE</text><text x="18" y="62" class="b">One token</text><text x="18" y="88" class="b">at a time</text><text x="18" y="116" class="m">tₙ₊₁</text></g>
  <g transform="translate(52 408)"><rect width="1096" height="62" rx="12" fill="#182246" stroke="#7180bd"/><text x="22" y="27" class="b">The serving trade-off</text><text x="22" y="49" class="t">Caching makes decode fast, but each active request reserves memory. Grouped-query attention and lower-precision caches reduce the pressure; long context and high concurrency increase it.</text></g>
</svg>
