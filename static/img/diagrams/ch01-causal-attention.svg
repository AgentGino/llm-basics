<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Causal self-attention in a decoder-only Transformer</title>
  <desc id="desc">Input vectors become queries, keys and values. Their score matrix is masked so each position can attend only to itself and earlier positions, then softmax weights combine values.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10152c"/><stop offset="1" stop-color="#1d2854"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#aebbe8"/></marker>
    <style>
      .h { font: 700 23px system-ui, sans-serif; fill: #fff; }.s { font: 500 14px system-ui, sans-serif; fill: #cbd5f5; }.k { font: 700 12px system-ui, sans-serif; letter-spacing: 1.2px; fill: #f6b865; }.b { font: 700 16px system-ui, sans-serif; fill: #fff; }.t { font: 500 12px system-ui, sans-serif; fill: #cbd5f5; }.m { font: 600 13px ui-monospace, monospace; fill: #dce5ff; }
    </style>
  </defs>
  <rect width="1200" height="590" rx="24" fill="url(#bg)"/>
  <text x="52" y="58" class="k">CAUSAL SELF-ATTENTION</text><text x="52" y="94" class="h">Each token can look backward — never forward</text><text x="52" y="121" class="s">The mask is what keeps next-token training honest.</text>
  <path d="M242 280H303M457 280H518M779 280H841M1026 280H1070" stroke="#aebbe8" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
  <g transform="translate(52 192)"><rect width="190" height="178" rx="16" fill="#20325f" stroke="#8ea6ff" stroke-width="2"/><text x="20" y="31" class="k">INPUT</text><text x="20" y="62" class="b">Token vectors X</text><text x="20" y="93" class="m">[x₀, x₁, x₂, x₃]</text><text x="20" y="122" class="t">shape: [batch, T, d_model]</text><text x="20" y="149" class="t">Each row is one token in context.</text></g>
  <g transform="translate(303 192)"><rect width="154" height="178" rx="16" fill="#3d2c62" stroke="#c39bff" stroke-width="2"/><text x="20" y="31" class="k">PROJECT</text><text x="20" y="62" class="b">Q, K, V</text><text x="20" y="92" class="m">Q = XWq</text><text x="20" y="117" class="m">K = XWk</text><text x="20" y="142" class="m">V = XWv</text></g>
  <g transform="translate(518 165)"><rect width="261" height="232" rx="16" fill="#28533c" stroke="#70dd9e" stroke-width="2"/><text x="20" y="31" class="k">COMPARE + MASK</text><text x="20" y="62" class="b">Scores = QKᵀ / √d</text><g transform="translate(22 84)"><rect width="28" height="28" fill="#8ee7b2"/><rect x="30" width="28" height="28" fill="#562d4d"/><rect x="60" width="28" height="28" fill="#562d4d"/><rect x="90" width="28" height="28" fill="#562d4d"/><rect y="30" width="28" height="28" fill="#8ee7b2"/><rect x="30" y="30" width="28" height="28" fill="#8ee7b2"/><rect x="60" y="30" width="28" height="28" fill="#562d4d"/><rect x="90" y="30" width="28" height="28" fill="#562d4d"/><rect y="60" width="28" height="28" fill="#8ee7b2"/><rect x="30" y="60" width="28" height="28" fill="#8ee7b2"/><rect x="60" y="60" width="28" height="28" fill="#8ee7b2"/><rect x="90" y="60" width="28" height="28" fill="#562d4d"/><rect y="90" width="28" height="28" fill="#8ee7b2"/><rect x="30" y="90" width="28" height="28" fill="#8ee7b2"/><rect x="60" y="90" width="28" height="28" fill="#8ee7b2"/><rect x="90" y="90" width="28" height="28" fill="#8ee7b2"/></g><text x="150" y="112" class="t">visible</text><text x="150" y="137" class="t">future = −∞</text><text x="20" y="180" class="t">Softmax makes every visible row sum to 1.</text></g>
  <g transform="translate(841 192)"><rect width="185" height="178" rx="16" fill="#164657" stroke="#55d0e9" stroke-width="2"/><text x="20" y="31" class="k">MIX VALUES</text><text x="20" y="62" class="b">Weights × V</text><text x="20" y="92" class="m">softmax(scores) V</text><text x="20" y="122" class="t">A token now contains</text><text x="20" y="146" class="t">selected earlier context.</text></g>
  <g transform="translate(1070 192)"><rect width="80" height="178" rx="16" fill="#684927" stroke="#f6b865" stroke-width="2"/><text x="16" y="31" class="k">OUT</text><text x="16" y="68" class="m">x′</text><text x="16" y="101" class="t">contextual</text><text x="16" y="121" class="t">token</text><text x="16" y="141" class="t">vectors</text></g>
  <path d="M52 442H1148" stroke="#8090c8" stroke-width="1" opacity=".45"/>
  <text x="52" y="478" class="b">Debugging cue</text><text x="52" y="508" class="s">If an upper-right cell has non-zero attention weight in a causal decoder, the model can see future tokens. That is label leakage, not learning.</text>
  <text x="52" y="546" class="t">Run the accompanying attention lab, remove the mask, and watch the prohibited cells become visible.</text>
</svg>
